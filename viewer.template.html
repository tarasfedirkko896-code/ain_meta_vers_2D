<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIN · 2D Hybrid</title><style>*{box-sizing:border-box}body{margin:0;background:#091324;color:#eef2ff;font:14px system-ui}header{min-height:80px;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;gap:18px;border-bottom:1px solid #29415b}h1{font-size:22px;margin:0}small{display:block;color:#a4b3ca;margin-top:6px}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#192a44;border:1px solid #486180;color:#e5edff;padding:9px 12px;border-radius:7px;cursor:pointer}button:hover{background:#324263}button[aria-pressed=true]{background:#6656b9}canvas{display:block;width:100%;height:calc(100vh - 120px);touch-action:none}footer{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#a3b4cb}#loading{position:fixed;inset:80px 0 40px;background:#0b1629;display:grid;place-items:center;font-size:20px}#loading.done{display:none}</style><header><div><h1>AIN <span style="color:#a392ff">2D Hybrid</span></h1><small>Сцена · партнери · нетворкінг</small></div><nav><button id="stage">До сцени</button><button id="depth">Перевірити перекриття</button><button id="overview">Уся карта</button><button id="walls" aria-pressed="false">Межі руху</button><button id="tops" aria-pressed="false">Сховати верхній шар</button></nav></header><canvas id="world" tabindex="0" aria-label="Рух стрілками, WASD або кліком по підлозі"></canvas><footer><span id="status">Завантаження…</span><span>WASD / стрілки · клік — маршрут · колесо — масштаб</span></footer><div id="loading">Завантажую карту…</div><script>
const M=__MAP__,FILES=__IMAGES__,TEST=__TESTSPOT__;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),W=M.width,H=M.height,T=32,col=M.layers.find(l=>l.name==='Collisions').data,start=M.layers.find(l=>l.name==='start').data;
const si=start.findIndex(Boolean);let player={x:si%W*T+16,y:Math.floor(si/W)*T+16},zoom=.65,showWalls=false,hideTops=false,overview=false,keys={},route=[],last=0,ready=false,cam={x:0,y:0};
const ground=document.createElement('canvas'),front=document.createElement('canvas'),walls=document.createElement('canvas');for(const c of [ground,front,walls]){c.width=W*T;c.height=H*T}const gc=ground.getContext('2d'),fc=front.getContext('2d'),wc=walls.getContext('2d');
function fit(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener('resize',fit);fit();
const imgs={};Promise.all(Object.entries(FILES).map(([n,url])=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{imgs[n]=i;res()};i.onerror=rej;i.src=url}))).then(()=>{let above=false;for(const l of M.layers){if(l.name==='floorLayer'){above=true;continue}if(l.type!=='tilelayer'||l.name==='start'||l.name==='Collisions')continue;const dest=above?fc:gc;l.data.forEach((gid,n)=>{if(!gid)return;const ts=[...M.tilesets].reverse().find(t=>t.firstgid<=gid),id=gid-ts.firstgid;dest.drawImage(imgs[ts.image],id%ts.columns*T,Math.floor(id/ts.columns)*T,T,T,n%W*T,Math.floor(n/W)*T,T,T)})}col.forEach((v,i)=>{if(v){wc.fillStyle='#ff345c88';wc.fillRect(i%W*T,Math.floor(i/W)*T,T,T)}});ready=true;document.querySelector('#loading').className='done';window.__ready=true;requestAnimationFrame(frame)}).catch(e=>{document.querySelector('#loading').textContent='Не вдалося прочитати текстури';console.error(e)});
function free(x,y){for(const dx of [-9,9])for(const dy of [-6,6]){let a=Math.floor((x+dx)/T),b=Math.floor((y+dy)/T);if(a<0||b<0||a>=W||b>=H||col[b*W+a])return false}return true}
function nearest(x,y){let a=Math.floor(x/T),b=Math.floor(y/T);for(let r=0;r<12;r++)for(let yy=b-r;yy<=b+r;yy++)for(let xx=a-r;xx<=a+r;xx++)if(xx>=0&&yy>=0&&xx<W&&yy<H&&!col[yy*W+xx])return{x:xx*T+16,y:yy*T+16};return player}
function moveTo(x,y){player=nearest(x,y);route=[];overview=false;zoom=.8}
document.querySelector('#stage').onclick=()=>moveTo(2560,1320);
document.querySelector('#depth').onclick=()=>{moveTo(TEST%W*T+16,Math.floor(TEST/W)*T+16);zoom=1.5};
document.querySelector('#overview').onclick=()=>{overview=!overview};
document.querySelector('#walls').onclick=e=>{showWalls=!showWalls;e.target.setAttribute('aria-pressed',showWalls)};
document.querySelector('#tops').onclick=e=>{hideTops=!hideTops;e.target.setAttribute('aria-pressed',hideTops);e.target.textContent=hideTops?'Повернути верхній шар':'Сховати верхній шар'};
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;route=[];if(overview)overview=false});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>keys={});
canvas.addEventListener('wheel',e=>{e.preventDefault();overview=false;zoom=Math.max(.25,Math.min(2,zoom*(e.deltaY<0?1.12:1/1.12)))},{passive:false});
function pathTo(goal){const from=Math.floor(player.y/T)*W+Math.floor(player.x/T);let q=[from],seen=new Set([from]),prev=new Map();for(let n=0;n<q.length;n++){const i=q[n];if(i===goal)break;const x=i%W,y=Math.floor(i/W);for(const [xx,yy] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){let j=yy*W+xx;if(xx>=0&&yy>=0&&xx<W&&yy<H&&!col[j]&&!seen.has(j)){seen.add(j);prev.set(j,i);q.push(j)}}}if(!seen.has(goal))return[];let p=[];for(let j=goal;j!==from;j=prev.get(j))p.unshift({x:j%W*T+16,y:Math.floor(j/W)*T+16});return p}
canvas.onclick=e=>{let b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)/cam.z+cam.x,y=(e.clientY-b.top)/cam.z+cam.y;const a=Math.floor(x/T),c=Math.floor(y/T);if(a>=0&&c>=0&&a<W&&c<H&&!col[c*W+a]){route=pathTo(c*W+a);overview=false}canvas.focus()};
function drawAvatar(){let x=Math.round(player.x),y=Math.round(player.y);ctx.fillStyle='#050b1688';ctx.beginPath();ctx.ellipse(x,y+2,12,5,0,0,7);ctx.fill();ctx.fillStyle='#10192d';ctx.fillRect(x-7,y-29,14,29);ctx.fillStyle='#c49a78';ctx.fillRect(x-5,y-26,10,10);ctx.fillStyle='#273248';ctx.fillRect(x-6,y-30,12,6);ctx.fillStyle='#78dcd6';ctx.fillRect(x-8,y-16,16,10);ctx.fillStyle='#3c6583';ctx.fillRect(x-6,y-6,5,8);ctx.fillRect(x+2,y-6,5,8)}
function frame(t){let dt=Math.min((t-last)/1000,.04);last=t;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(!dx&&!dy&&route.length){const n=route[0],dist=Math.hypot(n.x-player.x,n.y-player.y);if(dist<4){player={...n};route.shift()}else{dx=(n.x-player.x)/dist;dy=(n.y-player.y)/dist}}let len=Math.hypot(dx,dy)||1,speed=150*dt;if(free(player.x+dx/len*speed,player.y))player.x+=dx/len*speed;if(free(player.x,player.y+dy/len*speed))player.y+=dy/len*speed;let z=overview?Math.min(canvas.width/(W*T),canvas.height/(H*T)):zoom;cam={z,x:overview?-(canvas.width/z-W*T)/2:Math.max(0,Math.min(W*T-canvas.width/z,player.x-canvas.width/z/2)),y:overview?-(canvas.height/z-H*T)/2:Math.max(0,Math.min(H*T-canvas.height/z,player.y-canvas.height/z/2))};ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#091324';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(z,0,0,z,-cam.x*z,-cam.y*z);ctx.imageSmoothingEnabled=true;ctx.drawImage(ground,0,0);drawAvatar();if(!hideTops)ctx.drawImage(front,0,0);if(showWalls)ctx.drawImage(walls,0,0);ctx.fillStyle='#0b1427dd';ctx.fillRect(player.x-25,player.y-49,50,15);ctx.fillStyle='#edf8ff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('Ви тут',player.x,player.y-38);document.querySelector('#status').textContent=`Масштаб ${Math.round(z*100)}% · ${hideTops?'Верхній шар приховано':'Шари активні'}`;window.__state={player,hideTops,showWalls,zoom:z,free:free(player.x,player.y)};requestAnimationFrame(frame)}
</script></html>
